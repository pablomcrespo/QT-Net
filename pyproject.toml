[build-system]
# Hatchling will build the wheel and source distribution for this project.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qtnet"
version = "0.1.0"
authors = [
  { name = "Pablo Martínez Crespo", email = "pabloma@chalmers.se" },
  { name = "Stefano Ribes", email = "ribes.stefano@gmail.com" },
]
description = "A a Python package for learning atomic properties with thorough OOD evaluation."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["python", "packaging"]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

dependencies = [
    "chemprop>=1.7.1",
    "e3nn-jax>=0.20.7",
    "flax>=0.10.7,<0.11",
    "jax>=0.6.2,<0.7",
    "networkx>=3.4.2",
    "optuna>=4.7.0",
    "pandas>=3.0",
    "rdkit>=2025.9.5",
    "requests>=2.28.0",
    "scikit-learn>=1.7.2",
    "skops>=0.13.0",
    "xgboost>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/pablomcrespo/QT-Net"

[project.scripts]
# This creates a command 'hello-world' that runs the 'main' function
# inside 'src/qtnet/main.py'
hello-world = "qtnet.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qtnet"]

# Dependencies for developers (`uv sync` installs the dev group by default)
[dependency-groups]
dev = [
    "jupyterlab>=4.5.5",
    "matplotlib>=3.10.8",
    "notebook>=7.5.4",
    "py3dmol>=2.5.4",
    "pytest>=9.0.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
]
# Needed for SOAP: the environment classification, the 6-Bohr PCA distances
# (Figs 3, 19, t-SNEs) and the leakage analysis (`uv sync --group envclust`)
envclust = [
    "ase>=3.29.0",
    "dscribe>=2.1.2",
    "hdbscan>=0.8.44",
]

# Tool-specific configurations can live here too
[tool.pytest.ini_options]
testpaths = ["tests"]
